<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#171217">
<title>happy birthday, baby ♡</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@300;400;500&display=swap');
:root{--bg:#171217;--pink:#d9b4c3;--rose:#a66d83;--paper:#eadbc9;--ink:#49363a}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 35%,#382632 0%,#211821 45%,#100e12 100%);color:var(--pink);font-family:Montserrat, sans-serif;overflow-x:hidden}
main{position:relative;z-index:1;min-height:100svh;display:flex;align-items:center;justify-content:center;padding:42px 18px}
.screen{width:min(760px,100%);text-align:center}
.kicker{font-size:10px;letter-spacing:.35em;text-transform:uppercase;color:#b68b9c;margin-bottom:18px}
h1{font:500 clamp(36px,8vw,66px)/1.05 'Cormorant Garamond',serif;letter-spacing:.015em;color:#edcfda;margin:0;text-shadow:0 4px 30px #0008}
.subtitle{font:italic 19px 'Cormorant Garamond',serif;color:#c99eaf;margin:12px 0 4px}
.envelope-button{border:0;background:transparent;cursor:pointer;display:block;margin:18px auto 0;padding:0;width:min(390px,85vw);transition:transform .3s,filter .3s;filter:drop-shadow(0 18px 24px #0008);animation:arrive .8s cubic-bezier(.2,.8,.2,1) both}
.envelope-button:hover{transform:translateY(-7px) rotate(-1deg);filter:drop-shadow(0 24px 28px #0009)}
.envelope-button img{width:100%;height:auto;display:block}
.tap{font-size:9px;letter-spacing:.28em;text-transform:uppercase;color:#c59aaa;margin-top:0;animation:pulse 2s infinite}
.ornament{font:20px 'Cormorant Garamond',serif;color:#9b7182;margin-top:20px;letter-spacing:.3em}
@keyframes arrive{from{opacity:0;transform:translateY(25px) scale(.88)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes pulse{50%{opacity:.45}}
#letterScreen{display:none;text-align:left;max-width:720px;animation:appear .8s ease both}
@keyframes appear{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.paper{position:relative;background:linear-gradient(135deg,#f0e4d6,#e5d2bd 55%,#eadbca);color:var(--ink);padding:clamp(25px,6vw,58px);box-shadow:0 25px 80px #0009;border:1px solid #c9b29f}
.paper:before{content:"";position:absolute;inset:9px;border:1px solid #b99a91;pointer-events:none;opacity:.7}
.paper:after{content:"";position:absolute;inset:15px;background:repeating-linear-gradient(0deg,transparent 0 31px,#9c7770 32px,transparent 33px);opacity:.07;pointer-events:none}
.paper-inner{position:relative;z-index:1}
.letter-top{text-align:center;font:italic 25px 'Cormorant Garamond',serif;color:#946577;margin:0 0 25px}
.letter-body{font:400 clamp(16px,2.4vw,19px)/1.72 'Cormorant Garamond',serif;white-space:pre-line}
.letter-body p{margin:0 0 1.05em}
.signature{text-align:right;font:italic 24px 'Cormorant Garamond',serif;color:#946577;margin-top:28px}
.back{display:block;margin:22px auto 0;background:transparent;border:1px solid #a67c8e;color:#d8b3c1;padding:11px 18px;border-radius:30px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;cursor:pointer}
.hidden{display:none!important}
@media(max-width:480px){main{padding:30px 15px}.paper{padding:28px 23px}.paper:before{inset:6px}}
</style>
</head>

const letter = `joyeux anniversaire, ma chérie!

знаешь, я совсем не умею писать красивые письма, но ради тебя — хочется.

катюша, моя милая киця, я тебя очень сильно люблю. я хочу переплести наши пальцы в замок. я хочу, чтобы ты знала, что я готова подставить своё плечо, когда тебе хуево. когда ты себя называешь монстром, когда тебе кажется, что ты все портишь, я хочу быть тем человеком, который всегда будет готов тебя выслушать и не уйдёт. я хочу, чтобы ты знала, что я всегда буду рядом, что всегда поддержу тебя и твои решения.

я хочу быть в твоём 2027, 2028, 2029 и всех последующих годах. если ты позволишь, конечно. я хочу, чтобы ты была частью моей жизни. я хочу совместного будущего с тобой, и мечтаю о нем каждый день.

помнишь, как все начиналось? как мы ссорились постоянно? но, знаешь, я еще тогда чувствовала, что рядом с тобой — я могу быть собой. на самом деле я часто тебя вспоминала, и думала, как все же сложилась твоя жизнь. я боялась написать, потому что это казалось самым глупым решением на свете. мы так долго молчали, а в итоге все началось с видео про бомджека, лол. на самом деле, я рада, что это случилось именно сейчас, а не раньше или позже, мне кажется, что нам нужно было это время.

когда мы заговорили после нескольких месяцев, у меня были смешанные чувства. я не думала, что глупое начало приведёт к разговору по душам, которого мне так не хватало. я поняла, что мне не хватало тебя.

а еще я помню, как ты боялась, что я увижу в тебе "монстра". как ты говорила, что с тобой невозможно, что ты все испортишь. я знаю, что у тебя внутри куча травм, страхов и этого твоего нрл. я знаю, что тебе бывает больно и страшно настолько, что хочется сбежать или разрушить все к чертям. но я не боюсь тебя. я вижу твою кроличью натуру, которую так долго гнобили, и я хочу, чтобы ты знала — рядом со мной тебе не нужно защищаться.

let audioCtx;
function ctx(){if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}
function pop(){const c=ctx(),o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.setValueAtTime(620,c.currentTime);o.frequency.exponentialRampToValueAtTime(240,c.currentTime+.12);g.gain.setValueAtTime(.0001,c.currentTime);g.gain.exponentialRampToValueAtTime(.18,c.currentTime+.012);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.16);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.17)}
function paperSound(){const c=ctx(),len=Math.floor(c.sampleRate*.65),buf=c.createBuffer(1,len,c.sampleRate),d=buf.getChannelData(0);for(let i=0;i<len;i++){let env=Math.pow(1-i/len,1.5);d[i]=(Math.random()*2-1)*env*.45}const src=c.createBufferSource(),filter=c.createBiquadFilter(),g=c.createGain();src.buffer=buf;filter.type=' bandpass'.trim();filter.frequency.value=1500;filter.Q.value=.7;g.gain.value=.24;src.connect(filter);filter.connect(g);g.connect(c.destination);src.start()}
const cover=document.getElementById('cover'),letterScreen=document.getElementById('letterScreen');
document.getElementById('openBtn').addEventListener('click',()=>{paperSound();cover.classList.add('hidden');letterScreen.style.display='block';window.scrollTo({top:0,behavior:'smooth'})});
document.getElementById('backBtn').addEventListener('click',()=>{letterScreen.style.display='none';cover.classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'})});
window.addEventListener('load',()=>setTimeout(()=>{try{pop()}catch(e){}},450));
